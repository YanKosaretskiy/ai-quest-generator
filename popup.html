<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 780px;
      min-height: 500px; 
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      box-sizing: border-box;
      overflow-x: hidden;
      overflow-y: auto;
    }
    h3 {
      margin-top: 0;
      color: #4CAF50;
      text-align: center;
      font-size: 20px;
    }
    .form-group {
      margin-bottom: 16px;
      text-align: left;
      width: 100%;
      box-sizing: border-box;
    }
    label {
      display: block;
      font-size: 13px;
      color: #aaaaaa;
      margin-bottom: 6px;
      font-weight: bold;
    }
    
    textarea {
      width: 100%;
      box-sizing: border-box;
      background-color: #1e1e1e;
      border: 1px solid #333333;
      border-radius: 6px;
      color: #ffffff;
      padding: 10px;
      font-size: 14px;
      transition: border-color 0.2s;
      resize: none; 
      white-space: pre-wrap; 
      word-wrap: break-word; 
    }
    
    #world-setting, #char-class {
      height: 42px; 
    }
    #start-situation {
      height: 42px; 
    }

    textarea:focus {
      outline: none;
      border-color: #4CAF50;
    }
    .suggestions {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .suggest-btn {
      background-color: #252525;
      border: 1px solid #3e3e3e;
      color: #b0b0b0;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
    }
    .suggest-btn:hover {
      background-color: #333333;
      color: #ffffff;
      border-color: #555555;
    }
    .btn-container {
      display: flex;
      gap: 16px;
      margin-top: 24px;
      width: 100%;
      box-sizing: border-box;
    }
    .main-btn {
      flex: 1;
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
    }
    .main-btn:hover {
      background-color: #45a049;
    }
    #random-all-btn {
      background-color: #2a2a2a;
      color: #ffffff;
      border: 1px solid #444444;
    }
    #random-all-btn:hover {
      background-color: #353535;
    }

    /* ИГРОВОЙ ЭКРАН (двухпанельный режим) */
    #game-screen {
      display: flex;
      gap: 20px;
      width: 100%;
      box-sizing: border-box;
    }
    
    /* Левая панель: картинка */
    .visual-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    #quest-image {
      width: 340px;
      height: 340px;
      background-color: #1e1e1e;
      border: 1px solid #333333;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666666;
      font-size: 14px;
      object-fit: cover;
      overflow: hidden;
    }
    
    /* Кнопка сброса */
    #reset-btn {
      width: 100%;
      background-color: #2a2a2a;
      color: #ff5252;
      border: 1px solid #ff5252;
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.2s;
    }
    #reset-btn:hover {
      background-color: #3d1e1e;
    }
    
    /* Кнопки автоматических вариантов ответов ДМ */
    .action-variant-btn {
      display: block;
      width: 100%;
      background: #222222;
      color: #4CAF50;
      border: 1px solid #4CAF50;
      border-radius: 6px;
      padding: 8px 12px;
      margin: 8px 0;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      transition: background 0.2s, color 0.2s;
    }
    .action-variant-btn:hover {
      background: #1e3d22;
      color: #ffffff;
    }
    
    /* Правая панель: чат и ввод */
    .chat-panel {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      height: 450px;
    }
    /* Окно истории квеста */
    #chat-history {
      flex: 1;
      background-color: #1a1a1a;
      border: 1px solid #2d2d2d;
      border-radius: 6px;
      padding: 12px;
      overflow-y: auto;
      margin-bottom: 12px;
      text-align: left;
      font-size: 14px;
      line-height: 1.5;
    }
    /* Стили сообщений в чате */
    .msg {
      margin-bottom: 12px;
      padding: 8px 12px;
      border-radius: 6px;
    }
    .msg-ai {
      background-color: #252525;
      border-left: 3px solid #4CAF50;
      color: #e0e0e0;
    }
    .msg-player {
      background-color: #1e3d22;
      border-left: 3px solid #81C784;
      color: #ffffff;
      margin-left: 15px;
    }
    
    /* Зона ввода действий игрока */
    .input-container {
      display: flex;
      gap: 10px;
    }
    #player-action {
      height: 42px;
      min-height: 42px;
      max-height: 120px;
      overflow-y: auto;
    }
    #send-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 0 20px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
    }
    #send-btn:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <h3>AI Quest Generator</h3>
  
  <div id="setup-menu">
    <div class="form-group">
      <label for="world-setting">Игровой мир (напишите свой или выберите):</label>
      <textarea id="world-setting" placeholder="Например: Киберпанк, мир магии, постапокалипсис..."></textarea>
      <div class="suggestions">
        <button class="suggest-btn" data-target="world-setting" data-value="Средневековое темное фэнтези с опасной магией и монстрами">Фэнтези</button>
        <button class="suggest-btn" data-target="world-setting" data-value="Космический научно-фантастический мир далекого будущего">Космос</button>
        <button class="suggest-btn" data-target="world-setting" data-value="Мрачный киберпанк с неоновым смогом и всевластными корпорациями">Киберпанк</button>
      </div>
    </div>

    <div class="form-group">
      <label for="char-class">Ваш персонаж (напишите своего или выберите):</label>
      <textarea id="char-class" placeholder="Например: Эльф-лучник, детектив, наемник..."></textarea>
      <div class="suggestions">
        <button class="suggest-btn" data-target="char-class" data-value="Маг-недоучка, изгнанный из академии за опасные эксперименты">Маг</button>
        <button class="suggest-btn" data-target="char-class" data-value="Бывалый наемник с кибернетическим протезом руки">Наемник</button>
        <button class="suggest-btn" data-target="char-class" data-value="Опытный нетраннер (хакер) с поддельной цифровой личностью">Нетраннер</button>
      </div>
    </div>

    <div class="form-group">
      <label for="start-situation">Начальная ситуация (напишите свою или выберите):</label>
      <textarea id="start-situation" placeholder="Например: Очнулся в заброженной лаборатории, вокруг туман..."></textarea>
      <div class="suggestions">
        <button class="suggest-btn" data-target="start-situation" data-value="Я исследую заброшенное древнее подземелье в поисках проклятого артефакта вместе со своей командой авантюристов. Мы только что услышали, как позади нас рухнул каменный проход...">Поиск артефакта</button>
        <button class="suggest-btn" data-target="start-situation" data-value="Я остался последним выжившим на заброшенном исследовательском корабле. Системы жизнеобеспечения на исходе, в темноте коридоров слышны странные металлические щелчки, а радар показывает движение.">Заброшенный корабль</button>
      </div>
    </div>

    <div class="form-group">
      <label>Стиль иллюстраций окружения:</label>
      <select id="image-style" style="width: 100%; background: #1e1e1e; color: #fff; border: 1px solid #333; padding: 10px; border-radius: 6px; font-size: 14px;">
        <option value="photorealistic, high detail, 8k, cinematic lighting, moody atmosphere">Фотореализм</option>
        <option value="digital art, cyberpunk style, neon lights, vibrant colors, highly detailed screen">Киберпанк-арт</option>
        <option value="pixel art style, 16-bit, retro video game screen scene, nostalgic game colors">Пиксель-арт (16-бит)</option>
        <option value="oil painting style, thick brush strokes, classical dark fantasy art">Масляная живопись</option>
        <option value="dark fantasy sketch, charcoal drawing, gritty concept art, heavy ink lines">Мрачный набросок</option>
      </select>
    </div>

    <div class="btn-container">
      <button class="main-btn" id="random-all-btn">Заполнить всё случайно</button>
      <button class="main-btn" id="start-btn">Начать игру</button>
    </div>
  </div>

  <div id="game-screen" style="display: none;">
    
    <div class="visual-panel">
      <div id="quest-image">
        <div style="text-align: center; padding: 20px;">Тут будет изображение локации...</div>
      </div>
      <button id="reset-btn">Новая игра</button>
    </div>
    
    <div class="chat-panel">
      <div id="chat-history"></div>
      
      <div class="input-container">
        <textarea id="player-action" placeholder="Что вы будете делать? Напишите сюда..."></textarea>
        <button id="send-btn">Ход</button>
      </div>
    </div>

  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
